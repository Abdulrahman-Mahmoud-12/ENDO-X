services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DETECTOR_MODEL_PATH: /app/models/detector/best.pt
      SEGMENTER_MODEL_PATH: /app/models/segmenter/best.pth
      OUTPUTS_DIR: /app/app/storage/outputs
      UPLOADS_DIR: /app/app/storage/uploads
    volumes:
      - ./models:/app/models:ro
      - ./app/storage:/app/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm start"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
